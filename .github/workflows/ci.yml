name: CI - Build, Test & Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Ubuntu / eBPF)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Install eBPF Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            libbpf-dev \
            make \
            gcc \
            pkg-config

          # Attempt to install bpftool or linux-tools packages
          sudo apt-get install -y bpftool 2>/dev/null || \
          sudo apt-get install -y linux-tools-common linux-tools-generic 2>/dev/null || true

          # If bpftool is located in linux-tools, link it to PATH
          if ! command -v bpftool &>/dev/null; then
            TOOL_PATH=$(find /usr/lib/linux-tools/ -name bpftool 2>/dev/null | head -n 1 || true)
            if [ -n "$TOOL_PATH" ]; then
              sudo ln -sf "$TOOL_PATH" /usr/local/bin/bpftool
            fi
          fi

      - name: Prepare Kernel Headers (vmlinux.h)
        run: make vmlinux

      - name: Compile eBPF Bytecode
        run: make bpf

      - name: Execute Go Test Suite
        run: go test -v -race ./...

      - name: Build kshield Agent Binary
        run: make build

      - name: Verify Executable Binary
        run: |
          test -f bin/kshield
          ls -la bin/kshield
          file bin/kshield

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kshield-linux-amd64
          path: bin/kshield
          if-no-files-found: error
          retention-days: 7
